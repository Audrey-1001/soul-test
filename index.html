    // 全局变量
    let currentIndex = 0;
    let scores = { S:0, I:0, K:0, P:0, A:0, H:0, L:0, E:0 };

    const startPanelDiv = document.getElementById('startPanel');
    const quizPanelDiv = document.getElementById('quizPanel');
    const resultPanelDiv = document.getElementById('resultPanel');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const qCounterSpan = document.getElementById('qCounter');
    const progressFill = document.getElementById('quizProgressFill');
    const resultCardDiv = document.getElementById('resultCard');
    const copyBtn = document.getElementById('copyTextBtn');
    const shareBtn = document.getElementById('shareImgBtn');

    function updateProgress() {
        const percent = (currentIndex / QUESTIONS.length) * 100;
        progressFill.style.width = percent + "%";
        qCounterSpan.innerText = `${currentIndex} / ${QUESTIONS.length}`;
    }

    function renderQuestion() {
        if (currentIndex >= QUESTIONS.length) {
            finishTest();
            return;
        }
        const q = QUESTIONS[currentIndex];
        questionText.innerText = q.text;
        optionsContainer.innerHTML = '';
        q.opts.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            const markerSpan = document.createElement('span');
            markerSpan.className = 'opt-marker';
            markerSpan.innerText = idx === 0 ? 'A' : 'B';
            const textSpan = document.createElement('span');
            textSpan.innerText = opt;
            btn.appendChild(markerSpan);
            btn.appendChild(textSpan);
            btn.addEventListener('click', () => {
                const selectedVal = idx === 0 ? q.dim.charAt(0) : q.dim.charAt(1);
                scores[selectedVal]++;
                currentIndex++;
                updateProgress();
                if (currentIndex < QUESTIONS.length) renderQuestion();
                else finishTest();
            });
            optionsContainer.appendChild(btn);
        });
        updateProgress();
    }

    function finishTest() {
        try {
            const dimS_I = scores.S >= scores.I ? 'S' : 'I';
            const dimK_P = scores.K >= scores.P ? 'K' : 'P';
            const dimA_H = scores.A >= scores.H ? 'A' : 'H';
            const dimL_E = scores.L >= scores.E ? 'L' : 'E';
            const typeCode = dimS_I + dimK_P + dimA_H + dimL_E;
            const data = TYPE_DEEP[typeCode] || TYPE_DEEP["IPHE"];

            // 计算百分比
            const siP = Math.max(scores.S, scores.I) / 10 * 100;
            const kpP = Math.max(scores.K, scores.P) / 10 * 100;
            const ahP = Math.max(scores.A, scores.H) / 10 * 100;
            const leP = Math.max(scores.L, scores.E) / 10 * 100;
            const siTxt = scores.S >= scores.I ? `外向·社交引力 (S ${scores.S} : I ${scores.I})` : `内向·深度自省 (I ${scores.I} : S ${scores.S})`;
            const kpTxt = scores.K >= scores.P ? `理性·逻辑框架 (K ${scores.K} : P ${scores.P})` : `感性·情感共振 (P ${scores.P} : K ${scores.K})`;
            const ahTxt = scores.A >= scores.H ? `开拓·冒险精神 (A ${scores.A} : H ${scores.H})` : `安稳·务实宁静 (H ${scores.H} : A ${scores.A})`;
            const leTxt = scores.L >= scores.E ? `思辨·原则架构 (L ${scores.L} : E ${scores.E})` : `共情·温柔疗愈 (E ${scores.E} : L ${scores.L})`;

            const energyHtml = `
                <div class="energy-grid">
                    <div class="energy-item">🔥 激情指数: ${data.energy.passion}/100</div>
                    <div class="energy-item">⚓ 稳定指数: ${data.energy.stable}/100</div>
                    <div class="energy-item">🌹 浪漫指数: ${data.energy.romantic}/100</div>
                    <div class="energy-item">🧠 精神共鸣指数: ${data.energy.spiritual}/100</div>
                    <div class="energy-item">🍳 日常甜蜜指数: ${data.energy.daily}/100</div>
                </div>
            `;

            const fullHtml = `
                <div style="display:flex; align-items:baseline; flex-wrap:wrap;"><span class="type-badge">${typeCode}</span><span class="rarity">${data.rarity}</span></div>
                <div class="tag-group">${data.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>
                <div><strong>${data.title}</strong><br>${data.desc}</div>
                <div class="dimension-bar"><div class="dim-label"><span>🧬 ${siTxt}</span><span>${Math.round(siP)}%</span></div><div class="bar-line"><div class="bar-fill" style="width:${siP}%;"></div></div></div>
                <div class="dimension-bar"><div class="dim-label"><span>🎯 ${kpTxt}</span><span>${Math.round(kpP)}%</span></div><div class="bar-line"><div class="bar-fill" style="width:${kpP}%; background:#9b7bcb;"></div></div></div>
                <div class="dimension-bar"><div class="dim-label"><span>⛰️ ${ahTxt}</span><span>${Math.round(ahP)}%</span></div><div class="bar-line"><div class="bar-fill" style="width:${ahP}%; background:#b694e6;"></div></div></div>
                <div class="dimension-bar"><div class="dim-label"><span>💞 ${leTxt}</span><span>${Math.round(leP)}%</span></div><div class="bar-line"><div class="bar-fill" style="width:${leP}%; background:#ccb0ff;"></div></div></div>
                <div class="info-grid"><div class="info-title">🌸 约会灵感</div>${data.date}</div>
                <div class="info-grid"><div class="info-title">💌 爱情心法</div>${data.loveTip}</div>
                <div class="info-grid"><div class="info-title">⚠️ 相处雷区</div><ul>${data.avoid.map(a => `<li>${a}</li>`).join('')}</ul></div>
                <div class="info-grid"><div class="info-title">📈 成长建议</div><ul>${data.growth.map(g => `<li>${g}</li>`).join('')}</ul></div>
                <div class="info-grid"><div class="info-title">🎯 月度小挑战</div>${data.challenge}</div>
                <div class="info-grid"><div class="info-title">⚡ 恋爱五维能量图</div>${energyHtml}</div>
                <div class="info-grid"><div class="info-title">📜 专属情话/座右铭</div>${data.motto}</div>
                <div class="info-grid" style="background:#eef3ff;"><div class="info-title">💞 最佳配对</div>${data.ideal}<br><div class="info-title" style="margin-top:8px;">⚡ 压力配对</div>${data.pressure}</div>
            `;
            resultCardDiv.innerHTML = fullHtml;
            startPanelDiv.classList.add('hidden');
            quizPanelDiv.classList.add('hidden');
            resultPanelDiv.classList.remove('hidden');
            document.querySelector('.hero-header h1').innerText = "✨ 灵魂解析报告 ✨";
            document.querySelector('.hero-header p').innerText = "你的专属恋爱指南";
        } catch (err) {
            console.error(err);
            resultCardDiv.innerHTML = `<div class="error-message">⚠️ 生成报告时出错: ${err.message}<br>请刷新页面重试。</div>`;
            startPanelDiv.classList.add('hidden');
            quizPanelDiv.classList.add('hidden');
            resultPanelDiv.classList.remove('hidden');
        }
    }

    function resetAndStart() {
        currentIndex = 0;
        scores = { S:0, I:0, K:0, P:0, A:0, H:0, L:0, E:0 };
        startPanelDiv.classList.remove('hidden');
        quizPanelDiv.classList.add('hidden');
        resultPanelDiv.classList.add('hidden');
        document.querySelector('.hero-header h1').innerText = "✨ 心域共振 ✨";
        document.querySelector('.hero-header p').innerText = "16型伴侣灵魂解码 · 深度完整版";
        updateProgress();
        renderQuestion();
    }

    // 复制摘要
    copyBtn.addEventListener('click', () => {
        const text = resultCardDiv.innerText;
        navigator.clipboard.writeText(text).then(() => alert('✅ 报告已复制，快去分享吧！')).catch(() => alert('复制失败，可手动截图'));
    });
    // 截图分享：提示用户使用系统截图
    shareBtn.addEventListener('click', () => {
        alert('📸 请使用手机/电脑自带的截图功能保存报告图片，分享给朋友吧！');
    });

    startBtn.addEventListener('click', resetAndStart);
    restartBtn.addEventListener('click', resetAndStart);
</script>
