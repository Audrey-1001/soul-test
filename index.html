<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>心域共振 · 灵魂契合度深度测评</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #f2edf9; font-family: system-ui, sans-serif; color: #1f172a; line-height: 1.6; }
        .app-container { max-width: 550px; margin: 0 auto; background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .hero-header { background: linear-gradient(135deg, #6b4c9a 0%, #4b2b6e 100%); color: white; padding: 30px 20px; text-align: center; border-radius: 0 0 28px 28px; }
        .main-card { flex: 1; padding: 25px 20px; }
        .btn-primary { background: #6b4c9a; border: none; color: white; font-weight: 600; font-size: 1.1rem; padding: 16px 20px; border-radius: 60px; width: 100%; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-primary:active { transform: scale(0.98); background: #4f3577; }
        .opt-btn { width: 100%; background: #ffffff; border: 2px solid #e5d9f5; border-radius: 25px; padding: 15px 20px; text-align: left; font-size: 1rem; color: #2c1c45; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .opt-marker { background: #ede4ff; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; color: #4b2b6e; flex-shrink: 0; }
        .q-text { font-size: 1.35rem; font-weight: 700; color: #2a1a44; margin-bottom: 25px; min-height: 3rem; }
        .progress-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #8f7aae; font-size: 0.85rem; }
        .progress-bar-bg { background: #ede6f7; border-radius: 10px; height: 8px; flex: 1; margin-left: 12px; overflow: hidden; }
        .progress-fill { background: #a07fd6; width: 0%; height: 100%; transition: width 0.3s; }
        .result-card { background: #fefbff; border-radius: 28px; padding: 20px; }
        .hidden { display: none !important; }
        footer { text-align: center; font-size: 0.7rem; color: #bbb0cf; padding: 20px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="hero-header" id="pageHeader">
        <h1>✨ 心域共振 ✨</h1>
        <p>16型伴侣灵魂解码 · 深度完整版</p>
    </div>
    <div class="main-card">
        <div id="startPanel">
            <div style="text-align: center; margin: 40px 0;">
                <div style="font-size: 4rem;">💜</div>
                <h2 style="margin: 15px 0;">你的灵魂引力场</h2>
                <p style="color: #5e4b79;">40个走心选择 · 解锁专属伴侣类型</p>
            </div>
            <button class="btn-primary" id="startBtn">开始深度测评 →</button>
        </div>
        <div id="quizPanel" class="hidden">
            <div class="progress-info">
                <span id="qCounter">0 / 40</span>
                <div class="progress-bar-bg"><div class="progress-fill" id="quizProgressFill"></div></div>
            </div>
            <div class="q-text" id="questionText"></div>
            <div id="optionsContainer"></div>
        </div>
        <div id="resultPanel" class="hidden">
            <div id="resultCard" class="result-card"></div>
            <button class="btn-primary" id="restartBtn" style="background:transparent; border:2px solid #cbbaf0; color:#4b2b6e; margin-top:20px;">⟳ 重新测评</button>
        </div>
    </div>
    <footer>心域共振 · 四维八极深度模型</footer>
</div>

<script>
    const QUESTIONS = [
        { dim: "SI", text: "假期来临，你更倾向哪种安排？", opts: ["参加热闹音乐节/派对", "宅家看书或刷剧"] },
        { dim: "SI", text: "遇到一群陌生朋友组局，你会？", opts: ["主动加入聊天", "安静观察"] },
        { dim: "SI", text: "什么最能让你充电？", opts: ["和朋友聚餐", "独处冥想"] },
        { dim: "SI", text: "社交媒体上你通常？", opts: ["频繁分享", "偶尔潜水"] },
        { dim: "SI", text: "去咖啡馆你会？", opts: ["观察人群", "角落看书"] },
        { dim: "SI", text: "伴侣提议去大型派对？", opts: ["兴奋", "想早回"] },
        { dim: "SI", text: "旅行时喜欢？", opts: ["结交新朋友", "独自探索"] },
        { dim: "SI", text: "对“受欢迎”的态度？", opts: ["享受", "重深度"] },
        { dim: "SI", text: "开会/课堂上？", opts: ["积极发言", "成熟后说"] },
        { dim: "SI", text: "一整天不说话？", opts: ["烦闷", "放松"] },
        { dim: "KP", text: "重大决定依赖？", opts: ["数据分析", "直觉感受"] },
        { dim: "KP", text: "看电影被什么打动？", opts: ["剧情逻辑", "情感冲击"] },
        { dim: "KP", text: "伴侣情绪低落你先？", opts: ["分析解决", "拥抱安慰"] },
        { dim: "KP", text: "购物看重？", opts: ["性价比", "喜欢就买"] },
        { dim: "KP", text: "争议话题更认同？", opts: ["逻辑闭环", "理解立场"] },
        { dim: "KP", text: "更开心哪种称赞？", opts: ["聪明有条理", "温暖有人情味"] },
        { dim: "KP", text: "选书倾向？", opts: ["工具/逻辑书", "小说/诗集"] },
        { dim: "KP", text: "对规则的态度？", opts: ["逻辑服人", "灵活打破"] },
        { dim: "KP", text: "回忆过去记得？", opts: ["事实节点", "气氛情绪"] },
        { dim: "KP", text: "爱更多是？", opts: ["责任契约", "浪漫冲动"] },
        { dim: "AH", text: "面对未知机会？", opts: ["兴奋走起", "谨慎评估"] },
        { dim: "AH", text: "理想旅行？", opts: ["无计划流浪", "攻略周全"] },
        { dim: "AH", text: "高风险高回报？", opts: ["愿意赌", "稳健"] },
        { dim: "AH", text: "最不能忍受？", opts: ["一成不变", "动荡失控"] },
        { dim: "AH", text: "极限运动邀约？", opts: ["马上报名", "婉拒"] },
        { dim: "AH", text: "点新餐厅？", opts: ["尝试怪菜", "点熟悉的"] },
        { dim: "AH", text: "未来规划？", opts: ["随性惊喜", "3-5年计划"] },
        { dim: "AH", text: "更吸引你的伴侣？", opts: ["带我冒险", "给我港湾"] },
        { dim: "AH", text: "换工作/城市？", opts: ["期待新环境", "不安全感"] },
        { dim: "AH", text: "理财风格？", opts: ["新兴领域", "低风险"] },
        { dim: "LE", text: "伴侣伤心倾诉？", opts: ["分析问题", "共情拥抱"] },
        { dim: "LE", text: "吵架后更容易？", opts: ["讲道理", "在意情绪"] },
        { dim: "LE", text: "别人评价你？", opts: ["冷静理性", "温暖善解"] },
        { dim: "LE", text: "帮助朋友倾向？", opts: ["解决方案", "倾听陪伴"] },
        { dim: "LE", text: "喜欢的领导风格？", opts: ["公正制度", "感性关怀"] },
        { dim: "LE", text: "看社会新闻关注？", opts: ["事实逻辑", "情感处境"] },
        { dim: "LE", text: "规则公平性？", opts: ["铁面原则", "特殊共情"] },
        { dim: "LE", text: "重要沟通能力？", opts: ["逻辑清晰", "感知情绪"] },
        { dim: "LE", text: "理性vs感性", opts: ["理性可靠", "感性温度"] },
        { dim: "LE", text: "伴侣忘纪念日更在意？", opts: ["不尊重约定", "爱被忽视"] }
    ];

    const TYPE_DEEP = {
        "SKAL": { title:"皓月星穹", motto:"我要的不是崇拜，是并肩改写规则。" },
        "SKAH": { title:"蝶梦引路人", motto:"热情是我的燃料，你是降落的原因。" },
        "SKHL": { title:"极光守护使", motto:"秩序中开出温柔的花。" },
        "SKHE": { title:"暖风叙诗人", motto:"温柔是我最大的力量。" },
        "SPAL": { title:"赤焰探险家", motto:"生命是旷野，不是轨道。" },
        "SPAH": { title:"流光诗人", motto:"你是我的诗，我是你不必押韵的自由。" },
        "SPHL": { title:"静湖智士", motto:"生活的质感在细节里。" },
        "SPHE": { title:"晨露治愈者", motto:"我的快乐很简单，只要你也在笑。" },
        "IKAL": { title:"隐世哲人", motto:"灵魂的共鸣，胜过千言万语。" },
        "IKAH": { title:"月光叙事者", motto:"你读懂我的沉默，我便赠你星河。" },
        "IKHL": { title:"磐石架构师", motto:"我的爱藏在兑现的承诺里。" },
        "IKHE": { title:"绒心守望者", motto:"我的守护无声，但你一定感受得到。" },
        "IPAL": { title:"独行极客", motto:"常规是别人的地图，我的路自己画。" },
        "IPAH": { title:"幻梦织灵者", motto:"我的梦很大，但也留了一个位置给你。" },
        "IPHL": { title:"澄明隐者", motto:"最舒服的关系，是不用刻意找话题。" },
        "IPHE": { title:"温谷牧心人", motto:"我用温柔拥抱世界，也请温柔抱紧我。" }
    };

    let currentIndex = 0, scores = { S:0, I:0, K:0, P:0, A:0, H:0, L:0, E:0 };

    function renderQuestion() {
        if (currentIndex >= QUESTIONS.length) { showResult(); return; }
        const q = QUESTIONS[currentIndex];
        document.getElementById('questionText').innerText = q.text;
        document.getElementById('qCounter').innerText = (currentIndex + 1) + " / 40";
        document.getElementById('quizProgressFill').style.width = ((currentIndex+1)/40*100) + "%";
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';
        q.opts.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = `<span class="opt-marker">${idx===0?'A':'B'}</span><span>${opt}</span>`;
            btn.onclick = () => {
                scores[idx===0?q.dim[0]:q.dim[1]]++;
                currentIndex++;
                renderQuestion();
            };
            container.appendChild(btn);
        });
    }

    function showResult() {
        const code = (scores.S>=scores.I?'S':'I') + (scores.K>=scores.P?'K':'P') + (scores.A>=scores.H?'A':'H') + (scores.L>=scores.E?'L':'E');
        const data = TYPE_DEEP[code];
        document.getElementById('quizPanel').classList.add('hidden');
        document.getElementById('resultPanel').classList.remove('hidden');
        document.getElementById('resultCard').innerHTML = `
            <div style="font-size:2rem; font-weight:800; color:#3a266b; margin-bottom:10px;">${code}</div>
            <h2 style="margin-bottom:15px;">${data.title}</h2>
            <div style="background:#f9f5ff; padding:20px; border-radius:20px; border-left:5px solid #9b7bcb;">
                <p>“${data.motto}”</p>
            </div>
            <p style="margin-top:20px; font-size:0.9rem; color:#8f7aae;">报告已生成，请截图保存</p>
        `;
    }

    document.getElementById('startBtn').onclick = () => {
        document.getElementById('startPanel').classList.add('hidden');
        document.getElementById('quizPanel').classList.remove('hidden');
        renderQuestion();
    };

    document.getElementById('restartBtn').onclick = () => location.reload();
</script>
</body>
</html>
