        "IPHE":{title:"温谷牧心人·至纯治愈者",tags:["大地之爱","无条件接纳"],rarity:"N",desc:"内向·感性·安稳·共情 → 像森林深处的清泉。",date:"农场义工 / 安静茶馆",loveTip:"温和表达自己的需求",avoid:["欺骗","高强社交"],growth:["直接说‘我需要’","自我肯定清单"],challenge:"向伴侣提出一个具体需求",energy:{passion:35,stable:90,romantic:75,spiritual:80,daily:95},motto:"我用温柔拥抱世界，也请你温柔抱紧我。",ideal:"SKHE · IKHE",pressure:"SPAL"}
    };

    let currentIndex = 0, answers = [], scores = { S:0, I:0, K:0, P:0, A:0, H:0, L:0, E:0 };
    const startPanelDiv = document.getElementById('startPanel');
    const quizPanelDiv = document.getElementById('quizPanel');
    const resultPanelDiv = document.getElementById('resultPanel');
    const startBtnEl = document.getElementById('startBtn');
    const restartBtnEl = document.getElementById('restartBtn');
    const questionTextEl = document.getElementById('questionText');
    const optionsContainerEl = document.getElementById('optionsContainer');
    const qCounterSpan = document.getElementById('qCounter');
    const progressFillEl = document.getElementById('quizProgressFill');
    const resultCardEl = document.getElementById('resultCard');
    const copyBtnEl = document.getElementById('copyTextBtn');
    const shareBtnEl = document.getElementById('shareImgBtn');

    function updateProgress() { let p = (currentIndex/40)*100; progressFillEl.style.width = p+"%"; qCounterSpan.innerText = `${currentIndex}/40`; }
    function renderQuestion() {
        if(currentIndex>=40) { finishTest(); return; }
        let q = QUESTIONS[currentIndex];
        questionTextEl.innerText = q.text;
        optionsContainerEl.innerHTML = '';
        q.opts.forEach((opt,idx)=>{
            let btn = document.createElement('button'); btn.className='opt-btn';
            btn.innerHTML = `<span class="opt-marker">${idx===0?'A':'B'}</span><span>${opt}</span>`;
            btn.onclick = ()=>{
                answers.push(idx);
                let selected = idx===0 ? q.dim[0] : q.dim[1];
                scores[selected]++;
                currentIndex++;
                updateProgress();
                if(currentIndex<40) renderQuestion(); else finishTest();
            };
            optionsContainerEl.appendChild(btn);
        });
        updateProgress();
    }
    function finishTest() {
        let code = (scores.S>=scores.I?'S':'I') + (scores.K>=scores.P?'K':'P') + (scores.A>=scores.H?'A':'H') + (scores.L>=scores.E?'L':'E');
        let data = TYPE_DEEP[code] || TYPE_DEEP["IPHE"];
        let siP = Math.max(scores.S,scores.I)/10*100, kpP = Math.max(scores.K,scores.P)/10*100, ahP = Math.max(scores.A,scores.H)/10*100, leP = Math.max(scores.L,scores.E)/10*100;
        let siTxt = scores.S>=scores.I ? `外向·社交引力 (S ${scores.S} : I ${scores.I})` : `内向·深度自省 (I ${scores.I} : S ${scores.S})`;
        let kpTxt = scores.K>=scores.P ? `理性·逻辑框架 (K ${scores.K} : P ${scores.P})` : `感性·情感共振 (P ${scores.P} : K ${scores.K})`;
        let ahTxt = scores.A>=scores.H ? `开拓·冒险精神 (A ${scores.A} : H ${scores.H})` : `安稳·务实宁静 (H ${scores.H} : A ${scores.A})`;
        let leTxt = scores.L>=scores.E ? `思辨·原则架构 (L ${scores.L} : E ${scores.E})` : `共情·温柔疗愈 (E ${scores.E} : L ${scores.L})`;
        let energyHtml = `<div class="energy-grid"><div class="energy-item">🔥激情:${data.energy.passion}/100</div><div class="energy-item">⚓稳定:${data.energy.stable}/100</div><div class="energy-item">🌹浪漫:${data.energy.romantic}/100</div><div class="energy-item">🧠精神:${data.energy.spiritual}/100</div><div class="energy-item">🍳日常:${data.energy.daily}/100</div></div>`;
        resultCardEl.innerHTML = `
            <div style="display:flex;align-items:baseline;flex-wrap:wrap;"><span class="type-badge">${code}</span><span class="rarity">${data.rarity}</span></div>
            <div class="tag-group">${data.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
            <div><strong>${data.title}</strong><br>${data.desc}</div>
            <div class="dimension-bar"><div class="dim-label"><span>🧬 ${siTxt}</span><span>${Math.round(siP)}%</span></div><div class="bar-line"><div class="bar-fill" style="width:${siP}%"></div></div></div>
            <div class="dimension-bar"><div class="dim-label"><span>🎯 ${kpTxt}</span><span>${Math.round(kpP)}%</span></div><div class="bar-line"><div class="bar-fill" style="width:${kpP}%;background:#9b7bcb"></div></div></div>
            <div class="dimension-bar"><div class="dim-label"><span>⛰️ ${ahTxt}</span><span>${Math.round(ahP)}%</span></div><div class="bar-line"><div class="bar-fill" style="width:${ahP}%;background:#b694e6"></div></div></div>
            <div class="dimension-bar"><div class="dim-label"><span>💞 ${leTxt}</span><span>${Math.round(leP)}%</span></div><div class="bar-line"><div class="bar-fill" style="width:${leP}%;background:#ccb0ff"></div></div></div>
            <div class="info-grid"><div class="info-title">🌸约会灵感</div>${data.date}</div>
            <div class="info-grid"><div class="info-title">💌爱情心法</div>${data.loveTip}</div>
            <div class="info-grid"><div class="info-title">⚠️相处雷区</div><ul>${data.avoid.map(a=>`<li>${a}</li>`).join('')}</ul></div>
            <div class="info-grid"><div class="info-title">📈成长建议</div><ul>${data.growth.map(g=>`<li>${g}</li>`).join('')}</ul></div>
            <div class="info-grid"><div class="info-title">🎯月度小挑战</div>${data.challenge}</div>
            <div class="info-grid"><div class="info-title">⚡恋爱五维能量图</div>${energyHtml}</div>
            <div class="info-grid"><div class="info-title">📜专属情话/座右铭</div>“${data.motto}”</div>
            <div class="info-grid" style="background:#eef3ff;"><div class="info-title">💞最佳配对</div>${data.ideal}<br><div class="info-title" style="margin-top:8px;">⚡压力配对</div>${data.pressure}</div>
        `;
        startPanelDiv.classList.add('hidden'); quizPanelDiv.classList.add('hidden'); resultPanelDiv.classList.remove('hidden');
        document.querySelector('.hero-header h1').innerText = "✨ 灵魂解析报告 ✨";
        document.querySelector('.hero-header p').innerText = "你的专属恋爱指南";
    }
    function resetAndStart() {
        currentIndex=0; answers=[]; scores={S:0,I:0,K:0,P:0,A:0,H:0,L:0,E:0};
        startPanelDiv.classList.remove('hidden'); quizPanelDiv.classList.add('hidden'); resultPanelDiv.classList.add('hidden');
        document.querySelector('.hero-header h1').innerText = "✨ 心域共振 ✨";
        document.querySelector('.hero-header p').innerText = "16型伴侣灵魂解码 · 深度完整版";
        updateProgress(); renderQuestion();
    }
    startBtnEl.onclick = resetAndStart;
    restartBtnEl.onclick = resetAndStart;
    copyBtnEl.onclick = () => { navigator.clipboard.writeText(resultCardEl.innerText).then(()=>alert('✅报告已复制')).catch(()=>alert('复制失败')); };
    shareBtnEl.onclick = () => alert('📸 请使用手机/电脑截图保存分享');
    updateProgress();
</script>
</body>
</html>
